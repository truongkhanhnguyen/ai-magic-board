<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Magic Board - Fun Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #fdf3ff; overflow: hidden; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        @keyframes fade-in-down { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes fade-in-up { 0% { opacity: 0; transform: translateY(30px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes pop-in { 0% { opacity: 0; transform: translate(-50%, 60px) scale(0.5); } 50% { opacity: 1; transform: translate(-50%, -20px) scale(1.1); } 70% { transform: translate(-50%, 10px) scale(0.95); } 100% { opacity: 1; transform: translate(-50%, 0) scale(1); } }
        @keyframes shake-error { 0%, 100% { transform: translate(-50%, 0); } 10%, 30%, 50%, 70%, 90% { transform: translate(calc(-50% - 15px), 0); } 20%, 40%, 60%, 80% { transform: translate(calc(-50% + 15px), 0); } }
        @keyframes shockwave { 0% { transform: scale(0.5); opacity: 0.8; } 100% { transform: scale(2.5); border-width: 0px; opacity: 0; } }
        @keyframes run-across { 0% { left: -150px; transform: scaleX(-1); } 48% { left: 110vw; transform: scaleX(-1); } 50% { left: 110vw; transform: scaleX(1); } 98% { left: -150px; transform: scaleX(1); } 100% { left: -150px; transform: scaleX(-1); } }
        @keyframes sprint-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        .animate-fade-in-down { animation: fade-in-down 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in-up { animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .animate-pop-in { animation: pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-shake-error { animation: shake-error 0.5s cubic-bezier(.36,.07,.19,.97) forwards; }
        .animate-shockwave-layer { animation: shockwave 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .runner-container { position: absolute; bottom: 6vh; animation: run-across 12s linear infinite; z-index: 5; }
        .bounce-dog { display: inline-block; font-size: 5rem; animation: sprint-bounce 0.3s ease-in-out infinite alternate; }
        .bounce-robot { display: inline-block; font-size: 5rem; animation: sprint-bounce 0.4s ease-in-out infinite alternate; }

        .bg-mesh { background-image: radial-gradient(circle at 15% 50%, rgba(106, 28, 246, 0.08) 0%, transparent 50%), radial-gradient(circle at 85% 30%, rgba(172, 142, 255, 0.12) 0%, transparent 50%); }
        .shiny-btn { background-size: 200% 200%; box-shadow: 0 10px 30px -10px rgba(106, 28, 246, 0.6), inset 0px -4px 10px rgba(0,0,0,0.15), inset 0px 4px 10px rgba(255,255,255,0.3); transition: all 0.2s; }
        .shiny-btn:active { transform: scale(0.95); }
        
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root">
       <div style="text-align: center; margin-top: 20%; font-family: sans-serif; font-size: 24px; color: #6a1cf6;">
           Loading Fun UI...
       </div>
    </div>
    <script type="text/babel">
        try {
            const { useState, useEffect } = React;

            const QUESTION_BANK = [
                "My sister is a singer and she earns a lot of money.",
                "I'm living in London now.",
                "I will fly to Japan tomorrow.",
                "We have lived here for 5 years.",
                "Can you help me with this exercise?"
            ];

            function PresentationView() {
                const [qIndex, setQIndex] = useState(0);
                const [studentAnswer, setStudentAnswer] = useState('');
                const [checking, setChecking] = useState(false);
                const [feedback, setFeedback] = useState('pending');
                const [shakeKey, setShakeKey] = useState(0);

                const handleNav = (dir) => {
                    let next = qIndex + dir;
                    if (next < 0) next = QUESTION_BANK.length - 1;
                    if (next >= QUESTION_BANK.length) next = 0;
                    setQIndex(next);
                    setStudentAnswer('');
                    setFeedback('pending');
                };

                const handleSelectChange = (e) => {
                    setQIndex(Number(e.target.value));
                    setStudentAnswer('');
                    setFeedback('pending');
                };
                
                const handleCheck = () => {
                    if (!studentAnswer.trim()) return;
                    setChecking(true);
                    setFeedback('pending');
                    
                    setTimeout(() => {
                        setChecking(false);
                        // Giả lập check logic tenses (demo string)
                        const isCorrect = studentAnswer.toLowerCase().length > 10 && !studentAnswer.toLowerCase().includes('will'); 
                        
                        if (isCorrect) {
                            setFeedback('correct');
                            var end = Date.now() + (3 * 1000); // 3 giây
                            (function frame() {
                                confetti({ particleCount: 8, angle: 60, spread: 60, origin: { x: 0, y: 0.8 }, colors: ['#6a1cf6', '#4af8e3', '#ac8eff'] });
                                confetti({ particleCount: 8, angle: 120, spread: 60, origin: { x: 1, y: 0.8 }, colors: ['#6a1cf6', '#4af8e3', '#ac8eff'] });
                                if (Date.now() < end) { requestAnimationFrame(frame); }
                            }());
                        } else {
                            setFeedback('incorrect');
                            setShakeKey(prev => prev + 1);
                        }
                    }, 1500);
                };

                return (
                    <div className={"relative min-h-screen w-full flex flex-col items-center justify-center p-8 bg-mesh font-body transition-colors duration-500 " + (feedback === 'incorrect' ? 'bg-[#fff0f3]' : '')}>
                        
                        {/* TEACHER TOP NAVIGATION BAR */}
                        <div className="absolute top-6 left-6 right-6 z-50 flex justify-between items-center bg-white/40 backdrop-blur-md rounded-[2rem] px-8 py-4 shadow-[0_10px_30px_-10px_rgba(106,28,246,0.15)] border border-white/60">
                            
                            {/* Question Selector Dropdown */}
                            <div className="relative isolate font-display">
                                <select 
                                    className="bg-white/90 border-2 border-[#e5d5ff] text-[#38274c] text-xl font-bold rounded-2xl px-6 py-4 pr-14 focus:outline-none focus:border-[#6a1cf6] focus:ring-4 focus:ring-[#6a1cf6]/20 cursor-pointer shadow-sm hover:bg-white transition-all"
                                    value={qIndex}
                                    onChange={handleSelectChange}
                                >
                                    {QUESTION_BANK.map((q, i) => (
                                        <option key={i} value={i}>Question {i + 1}</option>
                                    ))}
                                </select>
                                <svg className="absolute right-5 top-1/2 -translate-y-1/2 w-6 h-6 text-[#6a1cf6] pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                            
                            {/* Arrows */}
                            <div className="flex gap-4">
                                <button onClick={() => handleNav(-1)} className="w-[4.5rem] h-[4.5rem] bg-white hover:bg-[#f8f5ff] text-[#6a1cf6] hover:text-[#420ebd] rounded-2xl flex items-center justify-center font-bold shadow-sm border-2 border-[#e5d5ff] hover:border-[#6a1cf6] transition-all transform hover:scale-[1.05] active:scale-95">
                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M15 19l-7-7 7-7"></path></svg>
                                </button>
                                <button onClick={() => handleNav(1)} className="w-[4.5rem] h-[4.5rem] bg-white hover:bg-[#f8f5ff] text-[#6a1cf6] hover:text-[#420ebd] rounded-2xl flex items-center justify-center font-bold shadow-sm border-2 border-[#e5d5ff] hover:border-[#6a1cf6] transition-all transform hover:scale-[1.05] active:scale-95">
                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            </div>
                        </div>

                        {/* ANIMATION CHÓ VÀ ROBOT */}
                        <div className="runner-container flex items-end gap-[60px] opacity-80 pointer-events-none">
                            <div className="bounce-robot filter drop-shadow-[0_10px_20px_rgba(106,28,246,0.3)]">🤖</div>
                            <div className="bounce-dog filter drop-shadow-[0_10px_20px_rgba(106,28,246,0.3)]">🐕</div>
                        </div>

                        {/* MAIN CONTENT AREA */}
                        <main key={qIndex} className="z-10 w-full max-w-6xl flex flex-col items-center space-y-20 mt-10">
                            <div className="text-center w-full animate-fade-in-down">
                                <p className="text-[#67537c] text-2xl font-bold tracking-[0.2em] uppercase mb-6 font-display">Question {qIndex + 1}</p>
                                <h1 className="text-[#38274c] text-[5rem] font-bold leading-[1.2] font-display">"{QUESTION_BANK[qIndex]}"</h1>
                            </div>

                            <div className="w-full max-w-5xl animate-fade-in-up relative" style={{ animationDelay: '100ms' }}>
                                <div className={"absolute -inset-2 rounded-full blur-lg opacity-30 transition-all duration-700 " + (feedback === 'correct' ? 'bg-[#4af8e3]' : feedback === 'incorrect' ? 'bg-[#f74b6d] animate-pulse' : 'bg-gradient-to-r from-[#6a1cf6] to-[#4af8e3]')}></div>
                                <input
                                    type="text"
                                    value={studentAnswer}
                                    onChange={(e) => setStudentAnswer(e.target.value)}
                                    placeholder="Type the reported speech..."
                                    className={"relative w-full text-center text-5xl py-12 px-12 bg-white/80 backdrop-blur-xl text-[#2d1b3f] placeholder-[#aa94c1]/60 rounded-full transition-all duration-300 outline-none shadow-2xl " + (feedback === 'correct' ? 'ring-4 ring-[#4af8e3]' : feedback === 'incorrect' ? 'ring-8 ring-[#f74b6d]/50 text-[#b41340]' : 'ring-1 ring-white focus:ring-4 focus:ring-[#ac8eff]/50')}
                                    readOnly={checking}
                                />
                            </div>

                            <div className="animate-fade-in-up" style={{ animationDelay: '200ms' }}>
                                <button
                                    onClick={handleCheck}
                                    disabled={checking || !studentAnswer.trim()}
                                    className={"relative px-24 py-8 rounded-[3rem] text-4xl font-bold text-white font-display shiny-btn " + ((checking || !studentAnswer.trim()) ? 'opacity-50 cursor-not-allowed filter grayscale-[20%]' : 'cursor-pointer hover:scale-[1.05]')}
                                    style={{ background: 'linear-gradient(135deg, #6a1cf6 0%, #ac8eff 100%)' }}
                                >
                                    {checking ? (
                                        <span className="flex items-center gap-5">
                                            <svg className="animate-spin h-10 w-10 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                                            Analyzing...
                                        </span>
                                    ) : 'AI CHECK'}
                                </button>
                            </div>
                        </main>

                        {/* HIỆU ỨNG THÔNG BÁO */}
                        {feedback !== 'pending' && !checking && (
                            <div 
                                key={feedback === 'incorrect' ? shakeKey : 'correct'}
                                className={"fixed bottom-16 left-1/2 z-50 flex items-center gap-8 px-14 py-8 rounded-[4rem] backdrop-blur-[30px] " + 
                                (feedback === 'correct' ? 'animate-pop-in bg-[#4af8e3]/20 border border-[#4af8e3] shadow-[0_40px_100px_-10px_rgba(74,248,227,0.8)]' : 
                                'animate-shake-error bg-[#f74b6d]/30 border-2 border-[#f74b6d] shadow-[0_40px_100px_-10px_rgba(247,75,109,0.9)]')}
                            >
                                <div className={"absolute inset-0 rounded-[4rem] border-4 pointer-events-none animate-shockwave-layer " + (feedback === 'correct' ? 'border-[#4af8e3]' : 'border-[#f74b6d]')} />
                                
                                {feedback === 'correct' ? (
                                    <React.Fragment>
                                        <div className="w-28 h-28 bg-[#00675d] border-4 border-[#4af8e3] rounded-full flex items-center justify-center text-7xl animate-bounce">🥳</div>
                                        <div className="flex flex-col gap-2">
                                            <h3 className="text-5xl font-bold text-[#00463f] font-display">JACKPOT!</h3>
                                            <p className="text-3xl text-[#00655b] font-body">10 Points for Gryffindor! 🏆</p>
                                        </div>
                                    </React.Fragment>
                                ) : (
                                    <React.Fragment>
                                        <div className="w-28 h-28 bg-[#b41340] border-4 border-[#f74b6d] rounded-full flex items-center justify-center text-7xl animate-pulse">😱</div>
                                        <div className="flex flex-col gap-2">
                                            <h3 className="text-5xl font-bold text-[#510017] font-display">Whoops!</h3>
                                            <p className="text-3xl text-[#a70138] font-body">Try shifting the tenses!</p>
                                        </div>
                                    </React.Fragment>
                                )}
                            </div>
                        )}
                        
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<PresentationView />);
        } catch (e) {
            document.getElementById('root').innerHTML = '<div style="color:red; font-size: 24px; padding: 50px;">Lỗi: ' + e.message + '</div>';
            console.error(e);
        }
    </script>
</body>
</html>
